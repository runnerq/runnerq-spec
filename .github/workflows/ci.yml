name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Vectors are in canonical layout
        run: go test ./verify -update -count=1 && git diff --exit-code
      - name: Generated TypeScript passes tsc (and Prettier, for constants)
        run: |
          mkdir -p /tmp/gen && go run ./tools/gen -lang ts -out /tmp/gen/spec.ts
          go run ./tools/gen -lang ts -part schema -out /tmp/gen/schema.ts
          go run ./tools/gen -part storage -lang ts -out /tmp/gen/storage.ts
          go run ./tools/gen -part executor-report -lang ts -out /tmp/gen/report.ts
          go run ./tools/gen -part conductor -lang ts -out /tmp/gen/conductor.ts
          go run ./tools/gen -part conductor -lang ts-specs -out /tmp/gen/specs.ts
          printf 'export type Spec = "string" | "int" | "number" | "bool" | "any" | { array: Spec } | { object: Record<string, Spec> } | (() => Spec);\n' > /tmp/gen/decode.ts
          cd /tmp/gen && npm init -y >/dev/null && npm i -s typescript@5 prettier@3
          npx tsc --strict --noUncheckedIndexedAccess --noEmit --target ES2022 --module nodenext spec.ts schema.ts storage.ts report.ts conductor.ts specs.ts
          npx prettier --check spec.ts

  catalog:
    # catalog.json must be what the migrations produce, on every supported
    # Postgres; migrations must also be safe to re-run (the tool runs them twice).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod
      - name: catalog.json is current
        working-directory: tools/catalog
        run: go vet . && go run . -dsn postgres://postgres:test@localhost:5432/postgres
      - name: Conformance runner builds
        working-directory: tools/conformance
        run: go vet . && go build -o /dev/null .

  conformance:
    # The scenarios against both SDKs' main branches: each alone, then both
    # on one database (the mixed fleet).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: runnerq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DSN: postgres://postgres:test@localhost:5432/runnerq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: runnerq/runnerq-go
          path: sdk/go
      - uses: actions/checkout@v4
        with:
          repository: runnerq/runnerq-ts
          path: sdk/ts
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/conformance/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the drivers
        run: |
          go -C sdk/go build -o "$RUNNER_TEMP/godriver" ./internal/conformancedriver
          (cd sdk/ts && npm ci --no-audit --no-fund && npm run build)
      - name: Go
        working-directory: tools/conformance
        run: go run . -dsn "$DSN" -driver go="$RUNNER_TEMP/godriver"
      - name: TypeScript
        working-directory: tools/conformance
        run: go run . -dsn "$DSN" -driver ts="node $GITHUB_WORKSPACE/sdk/ts/test/conformance-driver.mjs"
      - name: Mixed fleet
        working-directory: tools/conformance
        run: go run . -v -dsn "$DSN" -driver go="$RUNNER_TEMP/godriver" -driver ts="node $GITHUB_WORKSPACE/sdk/ts/test/conformance-driver.mjs"
