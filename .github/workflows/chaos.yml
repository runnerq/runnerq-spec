name: Chaos

# The chaos harness (tools/chaos) against both SDKs' main branches: each SDK
# alone, then a mixed fleet, then a mixed fleet through a rolling deploy from
# version A to B, with workers killed and paused and Postgres restarted. A failure prints the seed; rerun it with the seed input.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to replay (default: random)"
        required: false
      duration:
        description: "Fault window"
        required: false
        default: "120s"

permissions:
  contents: read

concurrency:
  group: chaos
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fleet: [go, ts, mixed, rolling]
    env:
      DSN: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: runnerq/runnerq-go
          path: sdk/go
      - uses: actions/checkout@v4
        with:
          repository: runnerq/runnerq-ts
          path: sdk/ts
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/chaos/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Not a service container: the harness restarts it by name.
      - name: Postgres
        run: |
          docker run -d --name runnerq-chaos-pg -e POSTGRES_PASSWORD=test -p 5432:5432 postgres:17
          for i in $(seq 60); do docker exec runnerq-chaos-pg pg_isready -U postgres && break; sleep 1; done
      - name: Build the workers
        run: |
          go -C sdk/go build -o "$RUNNER_TEMP/chaosworker" ./internal/chaosworker
          (cd sdk/ts && npm ci --no-audit --no-fund && npm run build)
          go -C tools/chaos build -o "$RUNNER_TEMP/chaos" .
      - name: Run
        run: |
          go_worker="go=$RUNNER_TEMP/chaosworker"
          ts_worker="ts=node $GITHUB_WORKSPACE/sdk/ts/test/chaos-worker.mjs"
          case "${{ matrix.fleet }}" in
            go) workers=(-worker "$go_worker" -n 3) ;;
            ts) workers=(-worker "$ts_worker" -n 3) ;;
            mixed) workers=(-worker "$go_worker" -worker "$ts_worker" -n 4) ;;
            rolling) workers=(-worker "$go_worker" -worker "$ts_worker" -n 4 -rolling) ;;
          esac
          seed=()
          if [ -n "${{ inputs.seed }}" ]; then seed=(-seed "${{ inputs.seed }}"); fi
          "$RUNNER_TEMP/chaos" -dsn "$DSN" "${workers[@]}" "${seed[@]}" \
            -roots 80 -duration "${{ inputs.duration || '120s' }}" \
            -faults kill,kill,pause,pg -pg-restart 'docker restart runnerq-chaos-pg' \
            -logs "$RUNNER_TEMP/chaos-logs"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ matrix.fleet }}
          path: ${{ runner.temp }}/chaos-logs
